<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root { --fondo: #f6f7f9; --tarjeta: #fff; --texto: #1f2328; --suave: #59636e; --borde: #d1d9e0;
            --acento: #1a73e8; --ok: #1e7e34; --error: #b3261e; }
    @media (prefers-color-scheme: dark) {
      :root { --fondo: #15181c; --tarjeta: #1f2328; --texto: #e6e8eb; --suave: #9aa4ae; --borde: #3a424b;
              --acento: #8ab4f8; --ok: #7ee2a0; --error: #f2b8b5; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; background: var(--fondo); color: var(--texto);
           font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; background: var(--tarjeta); border: 1px solid var(--borde);
           border-radius: 12px; padding: 24px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    h2 { font-size: 15px; margin: 20px 0 0; }
    .asignaciones td:nth-child(2) { color: var(--suave); font-size: 13px; }
    .suave { color: var(--suave); font-size: 13px; }
    label { display: block; margin: 20px 0 8px; font-weight: 600; }
    input[type=file] { width: 100%; }
    button { margin-top: 20px; width: 100%; padding: 12px; border: 0; border-radius: 8px; font-size: 15px;
             font-weight: 600; background: var(--acento); color: #fff; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #estado { margin-top: 16px; min-height: 1.5em; }
    .error { color: var(--error); }
    .aviso { margin-top: 16px; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    td { padding: 6px 0; border-bottom: 1px solid var(--borde); }
    td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
    a { color: var(--acento); }
    .enlaces { margin-top: 20px; display: grid; gap: 8px; }
    .enlaces a.boton { display: block; padding: 11px 12px; border: 1px solid var(--acento); border-radius: 8px;
                       text-align: center; text-decoration: none; font-weight: 600; }
    .enlaces a.boton.principal { background: var(--acento); color: var(--tarjeta); }
    details { margin-top: 8px; font-size: 13px; color: var(--suave); }
    summary { cursor: pointer; }
    details a { display: inline-block; margin-top: 8px; }
  </style>
</head>
<body>
<main>
  <h1>Corte Power BI</h1>
  <div class="suave" id="usuario">Cargando…</div>

  <label for="excel">Excel del día</label>
  <input type="file" id="excel" accept=".xlsx,.xls">

  <button id="ejecutar" disabled>Ejecutar corte</button>
  <div id="estado"></div>
  <div class="enlaces" id="enlaces"></div>
  <div id="resultado"></div>
</main>

<script>
  var boton = document.getElementById('ejecutar');
  var entrada = document.getElementById('excel');
  var estado = document.getElementById('estado');
  var resultado = document.getElementById('resultado');
  var enlaces = document.getElementById('enlaces');

  // u = {toConcentrado, toRaw, corte, comparacion}; los que falten no se muestran.
  function mostrarEnlaces(u) {
    enlaces.innerHTML = '';
    if (u.toConcentrado) enlaces.appendChild(enlace(u.toConcentrado, 'ToConcentrado', 'boton principal'));
    if (u.toRaw) enlaces.appendChild(enlace(u.toRaw, 'ToRawDaniNew', 'boton'));
    if (u.corte) enlaces.appendChild(enlace(u.corte, 'Abrir mi archivo Corte', 'boton'));
    if (u.comparacion) {
      var mas = document.createElement('details');
      var titulo = document.createElement('summary');
      titulo.textContent = 'Más opciones';
      mas.appendChild(titulo);
      mas.appendChild(enlace(u.comparacion, 'Ver la comparación fila por fila', ''));
      enlaces.appendChild(mas);
    }
  }

  function enlace(url, texto, clase) {
    var a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = texto; a.className = clase;
    return a;
  }

  // Cuántas filas recibió cada letra de cada grupo, con su mezcla de círculos (columna L).
  function mostrarAsignaciones(a) {
    if (!a) return;
    (a.avisos || []).forEach(function (texto) {
      var aviso = document.createElement('div');
      aviso.className = 'error aviso';
      aviso.textContent = '⚠ ' + texto;
      resultado.appendChild(aviso);
    });
    Object.keys(a.grupos).forEach(function (grupo) {
      var titulo = document.createElement('h2');
      titulo.textContent = 'Asignaciones · ' + grupo;
      resultado.appendChild(titulo);
      var tabla = document.createElement('table');
      tabla.className = 'asignaciones';
      Object.keys(a.grupos[grupo]).forEach(function (letra) {
        var c = a.grupos[grupo][letra];
        var mezcla = Object.keys(c.porCirculo).map(function (k) { return k + ' ' + c.porCirculo[k]; }).join('  ');
        var tr = tabla.insertRow();
        tr.insertCell().textContent = letra;
        tr.insertCell().textContent = mezcla;
        tr.insertCell().textContent = c.total;
      });
      resultado.appendChild(tabla);
      if (a.listas && a.listas[grupo]) {
        var usada = document.createElement('div');
        usada.className = 'suave';
        usada.textContent = 'Lista usada (' + (a.fuente[grupo] === 'hoja' ? 'hoja de asignaciones' : 'respaldo de Config') +
          '): ' + a.listas[grupo].join(', ');
        resultado.appendChild(usada);
      }
    });
    if (a.sinLista.length) {
      var aviso = document.createElement('div');
      aviso.className = 'error';
      aviso.textContent = 'Sin lista de asignación (columna B vacía): ' + a.sinLista.join(', ') +
        '. Revisa ASIGNACION en Config.';
      resultado.appendChild(aviso);
    }
  }

  function mostrarError(err) {
    estado.className = 'error';
    estado.textContent = (err && err.message) || String(err);
    boton.disabled = !entrada.files.length;
  }

  google.script.run
    .withSuccessHandler(function (e) {
      document.getElementById('usuario').textContent = 'Sesión: ' + e.usuario +
        (e.urlCorte ? '' : ' · La primera vez se creará tu archivo Corte en tu Drive.');
      if (!e.plantillaLista) mostrarError('La app todavía no tiene plantilla (falta ejecutar crearPlantilla).');
      mostrarEnlaces({ toRaw: e.urlToRaw, corte: e.urlCorte });
    })
    .withFailureHandler(mostrarError)
    .obtenerEstado();

  entrada.addEventListener('change', function () {
    boton.disabled = !entrada.files.length;
    estado.textContent = ''; estado.className = ''; resultado.innerHTML = '';
  });

  boton.addEventListener('click', function () {
    var archivo = entrada.files[0];
    if (!archivo) return;
    boton.disabled = true;
    estado.className = '';
    estado.textContent = 'Procesando ' + archivo.name + '… (lee el Excel, compara con Concentrado y llena Raw y ToConcentrado)';
    resultado.innerHTML = '';
    var lector = new FileReader();
    lector.onload = function () {
      var base64 = String(lector.result).split(',')[1];
      google.script.run
        .withSuccessHandler(function (r) {
          estado.className = '';
          estado.textContent = 'Listo en ' + r.segundos + ' s.';
          var filas = [
            ['Filas en el Excel', r.totalExcel],
            ['Sin email ni teléfono (omitidas)', r.omitidasVacias],
            ['Duplicadas en el Excel (omitidas)', r.omitidasDuplicadas],
            ['Escritas en Raw', r.enRaw],
            ['Ya estaban en Concentrado', r.yaEnConcentrado],
            ['Escritas en ToConcentrado', r.aToConcentrado]
          ];
          var tabla = document.createElement('table');
          filas.forEach(function (f) {
            var tr = tabla.insertRow();
            tr.insertCell().textContent = f[0];
            tr.insertCell().textContent = f[1];
          });
          resultado.appendChild(tabla);
          mostrarAsignaciones(r.asignaciones);
          if (r.letrasFueraDeListaB && r.letrasFueraDeListaB.length) {
            var avisoB = document.createElement('div');
            avisoB.className = 'error aviso';
            avisoB.textContent = '⚠ No están en la lista desplegable de la columna B: ' + r.letrasFueraDeListaB.join(', ') +
              '. Se escribieron igual (con un triángulo de advertencia y sin color). Para que salgan con su color, ' +
              'agrégalas a la lista desplegable de la columna B de ToConcentrado en tu archivo Corte.';
            resultado.insertBefore(avisoB, resultado.firstChild);
          }
          var detalle = document.createElement('div');
          detalle.className = 'suave';
          detalle.textContent = 'Excel ' + r.tiempos.excel + ' s · Concentrado (' + r.filasConcentrado +
            ' filas) ' + r.tiempos.concentrado + ' s · escritura ' + r.tiempos.escritura + ' s';
          resultado.appendChild(detalle);
          mostrarEnlaces({ toConcentrado: r.urlToConcentrado, toRaw: r.urlToRaw, corte: r.urlCorte,
            comparacion: r.urlComparacion });
          boton.disabled = false;
        })
        .withFailureHandler(mostrarError)
        .ejecutarCorte(base64, archivo.name, archivo.type);
    };
    lector.onerror = function () { mostrarError('No se pudo leer el archivo.'); };
    lector.readAsDataURL(archivo);
  });
</script>
</body>
</html>
